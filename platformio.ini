; xBloom Panel — firmware for the Elecrow CrowPanel Advance 4.3" (ESP32-S3, board V1.1-V1.3)
; Toolchain pinned to the versions Elecrow's own example is tested with.

[env:crowpanel-advance-43]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
build_unflags = -Os
build_flags =
	-O2
	-DFW_VERSION='"3.3.0"'
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-I include
lib_deps =
	https://github.com/lvgl/lvgl.git#v9.1.0
	https://github.com/lovyan03/LovyanGFX.git#1.2.26
	https://github.com/h2zero/NimBLE-Arduino.git#2.5.2
	https://github.com/bblanchon/ArduinoJson.git#v7.4.2

; Rebuild the ESP-IDF libraries with settings this panel needs (what Elecrow's
; "ESP32S3_120M" replacement libs do, plus memory relief for Wi-Fi + BLE + TLS):
board_build.f_flash = 80000000L
custom_sdkconfig =
	CONFIG_IDF_EXPERIMENTAL_FEATURES=y
	CONFIG_SPIRAM_MODE_OCT=y
	CONFIG_SPIRAM_SPEED_80M=y
	CONFIG_SPIRAM_SPEED=80
	CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	CONFIG_NIMBLE_MAX_CONNECTIONS=1
	CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240=y
	CONFIG_SPIRAM_XIP_FROM_PSRAM=y
	CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
	CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
	CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
	CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
	CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
